<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1740" viewBox="0 0 1200 1740" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
<style>
  .serif{font-family:'Songti SC','STSong','Noto Serif SC',serif}
  .title{font-size:29px;font-weight:700;fill:#2e2a26}
  .ink{fill:#2e2a26}
  .verm{fill:#a63a2b}
  .gray{fill:#55606b}
  .blue{fill:#2e5f8a}
  .body{font-size:15px;fill:#3a3632}
  .small{font-size:13.5px;fill:#6b625a}
  .panel{fill:#fffdf8;stroke:#d8cfbe;stroke-width:1.5}
  .chip{fill:#2e2a26}
  .chipx{fill:#a63a2b}
  .halo{paint-order:stroke;stroke:#fffdf8;stroke-width:5}
</style>

<!-- ============ 面板一：方位判定 ============ -->
<rect x="20" y="50" width="1160" height="780" rx="14" class="panel"/>
<text x="600" y="96" text-anchor="middle" class="serif title">一、方位判定：长江下游的「东南岸 / 西北岸」</text>
<line x1="475" y1="116" x2="725" y2="116" stroke="#a63a2b" stroke-width="3"/>

<!-- 长江河道（自西南向东北） -->
<path d="M 70 690 C 300 610, 560 520, 790 380 C 930 290, 1050 205, 1130 150" fill="none" stroke="#6d97b8" stroke-width="110" stroke-linecap="round" opacity="0.9"/>
<path d="M 70 690 C 300 610, 560 520, 790 380 C 930 290, 1050 205, 1130 150" fill="none" stroke="#aac5dc" stroke-width="62" stroke-linecap="round"/>

<!-- 流向箭头与标注 -->
<polygon points="1128,138 1150,166 1176,150" fill="#2e5f8a"/>
<text x="1115" y="112" text-anchor="middle" class="body" font-weight="700" fill="#2e5f8a">东北流向</text>

<!-- 城市 -->
<circle cx="640" cy="470" r="7" fill="#2e5f8a" stroke="#fffdf8" stroke-width="3"/>
<text x="640" y="444" text-anchor="middle" font-size="17" fill="#2e2a26" class="halo" font-weight="700">芜湖</text>
<circle cx="840" cy="352" r="7" fill="#2e5f8a" stroke="#fffdf8" stroke-width="3"/>
<text x="840" y="326" text-anchor="middle" font-size="17" fill="#2e2a26" class="halo" font-weight="700">南京</text>
<circle cx="1030" cy="252" r="7" fill="#2e5f8a" stroke="#fffdf8" stroke-width="3"/>
<text x="1030" y="226" text-anchor="middle" font-size="17" fill="#2e2a26" class="halo" font-weight="700">镇江</text>

<!-- 两岸方位标注 -->
<text x="430" y="380" text-anchor="middle" transform="rotate(-27 430 380)" font-size="21" font-weight="700" fill="#55606b" class="halo">西北岸（北岸）＝ 江右 ＝ 江西（六朝本义）</text>
<text x="660" y="560" text-anchor="middle" transform="rotate(-27 660 560)" font-size="21" font-weight="700" fill="#a63a2b" class="halo">东南岸（南岸）＝ 江东 ＝ 江左 ＝ 狭义「江南」</text>

<!-- 江北 / 中原 说明框 -->
<rect x="70" y="150" width="300" height="128" rx="10" fill="#eef1f3" stroke="#9aa6b0"/>
<text x="90" y="182" font-size="18" font-weight="700" fill="#55606b">江北 · 中原</text>
<text x="90" y="208" class="body" fill="#4a5560">六朝时「江右 / 江西」所指</text>
<text x="90" y="232" class="body" fill="#4a5560">（江淮之间一带）</text>
<text x="90" y="262" font-size="13" fill="#6b625a">注：古人坐北朝南 → 左＝东、右＝西，</text>

<!-- 吴地 说明框 -->
<rect x="760" y="600" width="330" height="132" rx="10" fill="#f7f0e1" stroke="#b98a3f"/>
<text x="780" y="632" font-size="17" font-weight="700" fill="#a63a2b">吴地：苏南 · 皖南沿江 · 浙北</text>
<text x="780" y="660" class="body">「江东 / 江左 / 江南」所指</text>
<text x="780" y="684" class="body">孙吴之基 · 六朝士族文化圈</text>
<text x="780" y="716" font-size="13" fill="#6b625a">故「江左＝江东、江右＝江西」</text>

<!-- 图例 -->
<circle cx="200" cy="788" r="6" fill="#a63a2b"/>
<text x="215" y="792" class="small">江东/江左：东南岸 · 吴地（狭义江南）</text>
<circle cx="555" cy="788" r="6" fill="#2e5f8a"/>
<text x="570" y="792" class="small">长江下游：自西南向东北流</text>
<circle cx="880" cy="788" r="6" fill="#55606b"/>
<text x="895" y="792" class="small">江右/江西：西北岸 · 江北（六朝）</text>

<!-- ============ 面板二：江西两条来源辨析 ============ -->
<rect x="20" y="850" width="1160" height="420" rx="14" class="panel"/>
<text x="600" y="896" text-anchor="middle" class="serif title">二、关键辨析：今「江西」≠「江之西」——两条来源</text>
<line x1="420" y1="916" x2="780" y2="916" stroke="#a63a2b" stroke-width="3"/>

<rect x="70" y="940" width="480" height="232" rx="12" fill="#eef1f3" stroke="#9aa6b0"/>
<text x="90" y="978" font-size="18" font-weight="700" fill="#55606b">来源一：方位词「江西 / 江右」· 六朝</text>
<text x="90" y="1012" class="body" fill="#4a5560">本义：长江下游西北岸（江北）</text>
<text x="90" y="1038" class="body" fill="#4a5560">所指：北方 · 中原（江淮之间）</text>
<text x="90" y="1064" class="body" fill="#4a5560">此「江西」与今江西省无源流关系</text>
<text x="90" y="1096" class="body" font-weight="700" fill="#55606b">→ 是「江之西」：江的西岸（西北岸）</text>
<text x="90" y="1146" font-size="13" fill="#6b625a">裴松之注引「江西」即指江北</text>

<text x="600" y="1040" text-anchor="middle" font-size="48" font-weight="700" fill="#a63a2b">≠</text>
<text x="600" y="1078" text-anchor="middle" class="small">两条来源</text>
<text x="600" y="1098" text-anchor="middle" class="small">不同源流</text>
<text x="600" y="1118" text-anchor="middle" class="small">口语合流 ≠ 词义同源</text>

<rect x="650" y="940" width="480" height="232" rx="12" fill="#f7f0e1" stroke="#b98a3f"/>
<text x="670" y="978" font-size="18" font-weight="700" fill="#a63a2b">来源二：行政区「江南西道」· 唐</text>
<text x="670" y="1012" class="body">唐代「江南道」之西半</text>
<text x="670" y="1038" class="body">省称 → 「江西」→ 今江西省</text>
<text x="670" y="1064" class="body">明清口语合流：「江右」成江西别称</text>
<text x="670" y="1096" class="body" font-weight="700" fill="#a63a2b">→ 是「江南西道」之简称</text>
<text x="670" y="1146" font-size="13" fill="#6b625a">省名源于唐「江南西道」，非江之西</text>

<!-- ============ 面板三：演变时间线 ============ -->
<rect x="20" y="1290" width="1160" height="360" rx="14" class="panel"/>
<text x="600" y="1336" text-anchor="middle" class="serif title">三、演变：从「精确方位」漂移为「政治—文化意象」</text>
<line x1="455" y1="1356" x2="745" y2="1356" stroke="#a63a2b" stroke-width="3"/>

<!-- 列1 -->
<rect x="40" y="1378" width="212" height="42" rx="8" class="chip"/>
<text x="146" y="1406" text-anchor="middle" font-size="16" font-weight="700" fill="#fffdf8">先秦 · 秦汉</text>
<text x="56" y="1440" class="small" fill="#3a3632">「江南」最早（《楚辞》）</text>
<text x="56" y="1462" class="small" fill="#3a3632">多指长江中游以南</text>
<text x="56" y="1484" class="small" fill="#3a3632">（湘江流域 · 今湖南）</text>
<text x="56" y="1506" class="small" fill="#3a3632">屈原所哀「江南」非吴越</text>
<text x="56" y="1528" class="small" fill="#3a3632">「江东」指吴地</text>
<text x="56" y="1550" class="small" fill="#3a3632">二者所指不同</text>

<!-- 列2 -->
<rect x="272" y="1378" width="212" height="42" rx="8" class="chipx"/>
<text x="378" y="1406" text-anchor="middle" font-size="16" font-weight="700" fill="#fffdf8">三国两晋 · 转折</text>
<text x="288" y="1440" class="small" fill="#3a3632">孙吴据江东</text>
<text x="288" y="1462" class="small" fill="#3a3632">「江东」成政权代称</text>
<text x="288" y="1484" class="small" fill="#3a3632">永嘉南渡后「江左」流行</text>
<text x="288" y="1506" class="small" fill="#3a3632">特指偏安东南的政权</text>
<text x="288" y="1528" class="small" fill="#3a3632">与士族圈（江左风流）</text>
<text x="288" y="1550" class="small" fill="#3a3632">「江南」与「江东」合流</text>
<text x="288" y="1572" class="small" fill="#3a3632">指向吴越</text>

<!-- 列3 -->
<rect x="504" y="1378" width="212" height="42" rx="8" class="chip"/>
<text x="610" y="1406" text-anchor="middle" font-size="16" font-weight="700" fill="#fffdf8">南北朝 · 唐</text>
<text x="520" y="1440" class="small" fill="#3a3632">北方称南朝为「江左」</text>
<text x="520" y="1462" class="small" fill="#3a3632">「江右 / 江西」指北方</text>
<text x="520" y="1484" class="small" fill="#3a3632">（江淮之间）</text>
<text x="520" y="1506" class="small" fill="#3a3632">唐设「江南道」</text>
<text x="520" y="1528" class="small" fill="#3a3632">后分江南东道、西道</text>
<text x="520" y="1550" class="small" fill="#3a3632">今「江西省」名源于此</text>

<!-- 列4 -->
<rect x="736" y="1378" width="212" height="42" rx="8" class="chip"/>
<text x="842" y="1406" text-anchor="middle" font-size="16" font-weight="700" fill="#fffdf8">中唐 · 两宋</text>
<text x="752" y="1440" class="small" fill="#3a3632">「江南」文学化收缩</text>
<text x="752" y="1462" class="small" fill="#3a3632">专指苏杭为中心的</text>
<text x="752" y="1484" class="small" fill="#3a3632">吴越膏腴之地</text>
<text x="752" y="1506" class="small" fill="#3a3632">（白居易：能不忆江南）</text>
<text x="752" y="1528" class="small" fill="#3a3632">「江东」退为行政区名</text>
<text x="752" y="1550" class="small" fill="#3a3632">宋「江南东路」</text>

<!-- 列5 -->
<rect x="968" y="1378" width="212" height="42" rx="8" class="chip"/>
<text x="1074" y="1406" text-anchor="middle" font-size="16" font-weight="700" fill="#fffdf8">明清</text>
<text x="984" y="1440" class="small" fill="#3a3632">「江南」固定为</text>
<text x="984" y="1462" class="small" fill="#3a3632">八府一州核心区</text>
<text x="984" y="1484" class="small" fill="#3a3632">（苏松常杭嘉湖宁镇）</text>
<text x="984" y="1506" class="small" fill="#3a3632">「江右」转为</text>
<text x="984" y="1528" class="small" fill="#3a3632">「江右商帮」别称</text>
<text x="984" y="1550" class="small" fill="#3a3632">脱离「江北」本义</text>
<text x="984" y="1572" class="small" fill="#a63a2b" font-weight="700">词义：方位词 → 地域称谓</text>

<!-- 连接箭头 -->
<polygon points="262,1376 274,1399 250,1399" fill="#9aa6b0"/>
<polygon points="494,1376 506,1399 482,1399" fill="#9aa6b0"/>
<polygon points="726,1376 738,1399 714,1399" fill="#9aa6b0"/>
<polygon points="958,1376 970,1399 946,1399" fill="#9aa6b0"/>

<!-- 结论条 -->
<rect x="20" y="1670" width="1160" height="54" rx="12" fill="#a63a2b"/>
<text x="600" y="1703" text-anchor="middle" font-size="17" font-weight="700" fill="#fffdf8">结论｜江东＝江左＝东南岸（狭义江南）　江西＝江右＝西北岸（江北）　今「江南」＝古「江东」· 今「江西」＝「江南西道」省称</text>
</svg>
